apiVersion: apps/v1
kind: Deployment
metadata:
  name: battery_cell_formation_aging-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: battery_cell_formation_aging-ui
  template:
    metadata:
      labels:
        app: battery_cell_formation_aging-ui
    spec:
      containers:
        - name: frontend
          image: example.invalid/battery_cell_formation_aging:replace-with-ci-built-image
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
