[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "battery-cell-formation-aging"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.9,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1",
  "celery[redis]>=5.4,<6", "pyjwt>=2.9,<3", "pytest>=8.3,<9"
]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
pythonpath = ["."]
